<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0d0c"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Diet Companion"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="diet-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="diet-icon-180.png"><title>My Two-Meal Companion</title>
<style>
:root{--bg:#090c0b;--card:#121715;--card2:#18201d;--line:#27322e;--text:#f4f7f5;--muted:#96a39d;--green:#a8f0c6;--green2:#52d68c;--amber:#ffc76b;--red:#ff8d8d;--r:22px;--shadow:0 18px 50px #0007}*{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}body{margin:0;background:radial-gradient(circle at 85% -10%,#17352a 0,transparent 32rem),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{color:inherit}.app{max-width:540px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:22px 2px 16px}.eyebrow{color:var(--green);font-size:.72rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}.top h1{font-size:1.65rem;margin:3px 0 0;letter-spacing:-.04em}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--green);color:#092115;font-weight:900}.view{display:none}.view.active{display:block}.hero{padding:24px;background:linear-gradient(145deg,#1c2b25,#101513);border:1px solid #2c4238;border-radius:28px;box-shadow:var(--shadow);margin-bottom:14px}.hero .date{color:var(--muted);font-size:.88rem}.hero h2{margin:8px 0 5px;font-size:2rem;letter-spacing:-.05em}.hero p{margin:0;color:#b7c3bd}.progress{height:7px;background:#27312d;border-radius:9px;margin-top:19px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--green));width:0;transition:.3s}.meal{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin:14px 0;overflow:hidden}.meal-head{padding:19px 18px 12px;display:flex;justify-content:space-between;gap:10px}.pill{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;font-weight:850;color:var(--green)}.status{font-size:.75rem;color:var(--muted);padding:5px 9px;border:1px solid var(--line);border-radius:99px}.meal h3{margin:6px 0 0;font-size:1.28rem;letter-spacing:-.02em}.foods{padding:0 18px 12px}.food{display:flex;align-items:start;gap:10px;border-top:1px solid #202824;padding:11px 0}.food:first-child{border-top:0}.food b{font-size:.92rem}.food small{display:block;color:var(--muted);margin-top:2px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green2);margin-top:6px;flex:none}.meal-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:12px 18px 18px}.btn{border:0;border-radius:14px;padding:13px 12px;font-weight:760;background:#242d29;min-height:48px}.btn.primary{background:var(--green);color:#092016}.btn.outline{border:1px solid #3b4943;background:transparent}.btn.danger{color:var(--red)}.recipe{margin:0 18px 16px;padding:14px;background:#0c100f;border-radius:15px;color:#c7d0cc;font-size:.86rem;line-height:1.55}.recipe summary{color:var(--text);font-weight:750;cursor:pointer}.section-title{display:flex;justify-content:space-between;align-items:end;margin:26px 2px 11px}.section-title h2{font-size:1.35rem;margin:0}.section-title span{color:var(--muted);font-size:.8rem}.tomorrow{opacity:.84}.nav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:#101513ed;backdrop-filter:blur(24px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:none;color:#7f8e87;display:grid;place-items:center;gap:4px;font-size:.62rem;padding:6px 2px}.nav button.active{color:var(--green)}.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8}.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0 18px}.daychip{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:10px 2px;text-align:center;color:var(--muted)}.daychip b{display:block;color:var(--text);font-size:.78rem}.daychip.active{border-color:var(--green2);background:#173023}.library-card,.entry,.settings-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:10px 0}.library-card h3,.entry h3{margin:3px 0 8px}.library-card p,.entry p{color:var(--muted);font-size:.87rem;line-height:1.5;margin:5px 0}.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px 16px;color:var(--text);outline:none}.form label{display:block;color:#b4c0ba;font-size:.78rem;margin:13px 0 6px}.form input,.form textarea,.form select{width:100%;border:1px solid #34413b;background:#0d1210;border-radius:13px;padding:12px;color:var(--text)}.form textarea{min-height:88px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.filedrop{border:1px dashed #52635b;border-radius:14px;padding:15px;text-align:center;color:var(--muted);margin-top:12px}.analysis{padding:13px;border-radius:13px;background:#241f14;color:#f5dba9;font-size:.85rem;line-height:1.45;margin-top:12px}.analysis.good{background:#12291e;color:#b6efd0}.modal{position:fixed;z-index:50;inset:0;background:#000b;display:none;align-items:end}.modal.open{display:flex}.sheet{width:min(540px,100%);max-height:92vh;overflow:auto;margin:auto;background:#161c19;border-radius:28px 28px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -20px 70px #000}.sheet h2{margin:0 0 4px}.close{float:right;border:0;background:#2a332f;width:36px;height:36px;border-radius:50%}.choice{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:18px 0}.choice button.active{outline:2px solid var(--green2)}canvas{width:100%;height:190px;background:#0d1210;border-radius:16px;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:35px 10px}.notice{font-size:.78rem;color:var(--muted);line-height:1.45;padding:12px 2px}.toast{position:fixed;z-index:80;left:50%;bottom:100px;transform:translate(-50%,20px);opacity:0;background:#edf9f1;color:#102018;padding:11px 16px;border-radius:99px;font-weight:750;transition:.25s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:700px){.app{padding-left:8px;padding-right:8px}.sheet{border-radius:28px;margin-bottom:12px}.modal{align-items:center}}
</style></head>
<body><main class="app"><header class="top"><div><div class="eyebrow">Personal diet companion</div><h1 id="pageTitle">Today</h1></div><div class="avatar">T</div></header>
<section id="today" class="view active"></section><section id="planner" class="view"></section><section id="recipes" class="view"></section><section id="health" class="view"></section><section id="more" class="view"></section></main>
<nav class="nav" id="nav"></nav><div id="modal" class="modal"><div class="sheet"><button class="close" onclick="closeModal()">✕</button><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const plans=[
{day:'Sunday',m1:{title:'Prawns curry & rice',foods:['Rice|100g','Prawns curry|150g; Coconut oil 1/2 tbsp','Vegetable Curries|2 — Brinjal / kohila / Radish / Dambala','One egg bullsey|Butter 1/2 tbsp','Gotukola sambal with carrots|','Kiwis slices / Strawberry|'],recipe:'Cook prawns curry using Coconut oil 1/2 tbsp. Prepare two vegetable curries from the listed choices. Make one egg bullsey with butter 1/2 tbsp; serve with Gotukola sambal and fruit.'},m2:{title:'Grilled chicken & Feta salad',foods:['Chicken, grilled or baked|200g','One egg boiled|1','Vegetables salad|Feta cheese 30g; Avacado slices 100g'],recipe:'Combine Gherkin, Cucumber, bellpepper, Tomato, onions, Olive, Lettuce and Avacado slices 100g. Add Feta cheese 30g, Olive oil 1 tbsp, Lime juice 1 tbsp, Origano 1 tbsp, salt and pepper.'}},
{day:'Monday',m1:{title:'Fish curry & rice',foods:['Rice|100g','Fish curry|150g; Coconut oil 1 tbsp & milk','Vegetable curries|2 — Mushrooms / Beans / Radish / Broccoli','One egg boiled|1','Cucumber salad|','Strawberry|'],recipe:'Prepare Fish curry 150g using Coconut oil 1 tbsp and milk. Cook two vegetables using coconut oil and milk. Serve with rice, boiled egg, cucumber salad and Strawberry.'},m2:{title:'Mix kotthu',foods:['Two eggs|2','Sausages|50g','Chicken|50g','Prawns|50g','Cashew|30g','Avacado or Strawberry|100g or 3'],recipe:'Mix eggs, Sausages, Chicken, Prawns and Cashew with onion, carrot, tomato, Leeks and cabbage. Cook using coconut oil 1 1/2 tbsp.'}},
{day:'Tuesday',m1:{title:'Chicken Stew & rice',foods:['Rice|100g','Chicken Stew|150g; Coconut oil 1 tbsp','Cashew & Carrot Curry|Cashew 30g','Vegetable Curry|1','Kola mallum|Scraped Coconut 3 tbsp','Strawberry|'],recipe:'Stew chicken with Carrot, Onion, Bell Pepper and tomato using Coconut oil 1 tbsp. Add one vegetable curry and Kola mallum with Scraped Coconut 3 tbsp.'},m2:{title:'Chicken Sausages Omelette',foods:['Fried Chicken Sausages|100g','Three eggs|3','Mozzarella Cheese|30g','Vegetable Salad|'],recipe:'Make omelette with sausages, three eggs and Mozzarella Cheese using Coconut oil 1 tbsp. Salad: Cucumber, Onion, Cabbage, tomato, Lettuce and Green Chilli; add mayonnaise 1 tbsp, mustard Cream 1 tbsp and Lime juice 1 tbsp.'}},
{day:'Wednesday',m1:{title:'Mutton curry & rice',foods:['Rice|100g','Mutton curry|150g; Coconut oil 1 tbsp','One egg boiled|1','Beans curry|','Kankung & tomato tempered|','Cashew nuts & Carrot curry|Cashew 30g; carrot 100g','Avacado or Nelli|'],recipe:'Cook Mutton curry using Coconut oil 1 tbsp. Temper Kankung and tomato using coconut oil. Prepare Cashew and Carrot curry using coconut oil and milk.'},m2:{title:'Chicken Omelette',foods:['Fried Chicken|100g','Two eggs|2','Mozzarella Cheese|30g','Gherkin salad|','Olive|3–4'],recipe:'Make omelette with chicken, eggs, Mozzarella Cheese, Onion and Green chilli using Coconut oil 2 tbsp (source text says “2 tbdp”). Salad: Gherkin, Onions, bell pepper, Tomato, Lettuce and Carrot with Lime juice, pepper and salt.'}},
{day:'Thursday',m1:{title:'Prawns Curry & rice',foods:['Rice|100g','Prawns Curry|150g; Coconut oil 1 tbsp & milk','One egg boiled|1','Vegetable Curry|1 — Beans / Leeks / Radish','Winged beans mallum|Scraped Coconut 3 tbsp','Olive or Avacado|3–4'],recipe:'Cook Prawns Curry using Coconut oil 1 tbsp and milk. Add one vegetable curry using Coconut oil and Coconut milk, plus Winged beans mallum with Scraped Coconut 3 tbsp.'},m2:{title:'Small Fried Fish & salad',foods:['Small Fried Fish|200g; Coconut oil 2 tbsp','One egg omelette|1','Vegetable Salad|','Almond nuts|30g'],recipe:'Fry Small Fish using Coconut oil 2 tbsp. Salad: Carrot, Onion, tomato, Green Chilli and Lettuce, seasoned with salt, pepper and Lime juice.'}},
{day:'Friday',m1:{title:'Fish Abulthiyal & rice',foods:['Rice|100g','Fish Abulthiyal or curry|150g','One egg boiled|1','Vegetables curries|2','Kola mallum|','Strawberry / Avacado|'],recipe:'Prepare Fish Abulthiyal or curry. Cook two vegetable curries using coconut oil and milk. Serve with rice, egg, Kola mallum and listed fruit.'},m2:{title:'Chicken Salad',foods:['Fried chicken|150g','Almond|30g','One egg boiled|1','Cheddar cheese|30g','Kiwis / Avacado|'],recipe:'Combine fried chicken, Almond and egg with Carrot, Cabbage, onion, green chilli, Lettuce and bell pepper. Add Lime juice 1 tbsp and mayonnaise 1 tbsp; serve with Cheddar cheese.'}},
{day:'Saturday',m1:{title:'Sausages tempered & red rice',foods:['Red rice|100g','Sausages tempered|150g','One boiled egg|1','Vegetables curries|2','Gotukola sambal|','Kiwi or Nelli|'],recipe:'Temper sausages with Onion, tomato and capsicum using coconut oil. Serve with Red rice, one boiled egg, two vegetable curries cooked using coconut oil and milk, Gotukola sambal and the listed fruit.'},m2:{title:'Chicken Vegetable soup',foods:['Chicken|200g','Vegetables|Carrot, Leeks, beans, tomato, Broccoli','Butter|1 tbsp','Peanut / Almond / cashew|40g','Avocado slices / Ambaralla slices|'],recipe:'Make Chicken Vegetable soup with Chicken 200g, Carrot, Leeks, beans, tomato and Broccoli, adding butter 1 tbsp. Serve with the listed nuts and fruit slices.'}}
];
const DB='TwoMealCompanion',STORE='records';let db,selectedMeal=null,editingId=null;
const icons={today:'<path d="M4 5h16v15H4zM8 3v4m8-4v4M4 10h16"/>',planner:'<path d="M5 4h14v16H5zM8 2v4m8-4v4M8 11h3m2 0h3m-8 4h3m2 0h3"/>',recipes:'<path d="M6 3h10a2 2 0 012 2v16H8a2 2 0 01-2-2zM9 8h6m-6 4h6"/>',health:'<path d="M3 13h4l2-6 4 12 2-6h6"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'};
function openDB(){return new Promise((res,rej)=>{let q=indexedDB.open(DB,1);q.onupgradeneeded=()=>q.result.createObjectStore(STORE,{keyPath:'id'});q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>rej(q.error)})}
function put(x){return new Promise((res,rej)=>{let q=db.transaction(STORE,'readwrite').objectStore(STORE).put(x);q.onsuccess=res;q.onerror=()=>rej(q.error)})}function all(){return new Promise((res,rej)=>{let q=db.transaction(STORE).objectStore(STORE).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const iso=d=>d.toLocaleDateString('en-CA');const dayPlan=d=>plans.find(p=>p.day===d.toLocaleDateString('en',{weekday:'long'}));
function foodRows(m){return m.foods.map(x=>{let [a,b]=x.split('|');return `<div class="food"><i class="dot"></i><div><b>${esc(a)}</b>${b?`<small>${esc(b)}</small>`:''}</div></div>`}).join('')}
async function mealCard(m,n,date,compact=false){let rs=await all(),key=iso(date),r=rs.find(x=>x.type==='meal'&&x.date===key&&x.meal===n),st=r?(r.exact?'Completed exactly':'Recorded different'):'Not recorded';return `<article class="meal ${compact?'tomorrow':''}"><div class="meal-head"><div><span class="pill">Meal ${n}</span><h3>${esc(m.title)}</h3></div><span class="status">${st}</span></div><div class="foods">${foodRows(m)}</div><details class="recipe"><summary>View source-based recipe</summary><p>${esc(m.recipe)}</p></details>${compact?'':`<div class="meal-actions"><button class="btn primary" onclick="openMeal('${key}',${n})">${r?'View record':'Record meal'}</button><button class="btn outline" onclick="quickExact('${key}',${n})">✓ Ate exactly</button></div>`}</article>`}
async function renderToday(){let d=new Date(),t=new Date(d);t.setDate(d.getDate()+1);let p=dayPlan(d),pt=dayPlan(t),rs=await all(),done=rs.filter(x=>x.type==='meal'&&x.date===iso(d)).length;document.querySelector('#today').innerHTML=`<div class="hero"><div class="date">${d.toLocaleDateString('en',{weekday:'long',month:'long',day:'numeric'})}</div><h2>Your two-meal plan</h2><p>${done} of 2 meals recorded today</p><div class="progress"><i style="width:${done*50}%"></i></div></div>${await mealCard(p.m1,1,d)}${await mealCard(p.m2,2,d)}<div class="section-title"><h2>Tomorrow</h2><span>${t.toLocaleDateString('en',{weekday:'short',month:'short',day:'numeric'})}</span></div>${await mealCard(pt.m1,1,t,true)}${await mealCard(pt.m2,2,t,true)}<p class="notice">This organizer reproduces doctor-issued diet wording and makes simple plan-vs-actual comparisons. It does not diagnose, prescribe, or replace your clinician.</p>`}
function switchView(id){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.id===id));document.querySelector('#pageTitle').textContent={today:'Today',planner:'Weekly plan',recipes:'Recipe library',health:'Health history',more:'Data & settings'}[id];({today:renderToday,planner:renderPlanner,recipes:renderRecipes,health:renderHealth,more:renderMore}[id])()}
function renderNav(){nav.innerHTML=['today','planner','recipes','health','more'].map(x=>`<button data-id="${x}" onclick="switchView('${x}')"><svg viewBox="0 0 24 24">${icons[x]}</svg>${x[0].toUpperCase()+x.slice(1)}</button>`).join('');nav.firstChild.classList.add('active')}
function renderPlanner(){let names=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],today=new Date().getDay();planner.innerHTML=`<div class="weekstrip">${names.map((x,i)=>`<div class="daychip ${i===today?'active':''}"><b>${x}</b>${i===today?'Today':'Plan'}</div>`).join('')}</div>${plans.map(p=>`<div class="library-card"><span class="pill">${p.day}</span><h3>${esc(p.m1.title)} · ${esc(p.m2.title)}</h3><p>Meal 1: ${p.m1.foods.map(x=>x.split('|')[0]).join(', ')}</p><p>Meal 2: ${p.m2.foods.map(x=>x.split('|')[0]).join(', ')}</p></div>`).join('')}<p class="notice">Weekly rotation assembled from the historical dated menus. The chat did not provide confirmed fixed clock times, so none are invented here.</p>`}
function renderRecipes(){let list=plans.flatMap(p=>[...['m1','m2'].map((k,i)=>({...p[k],day:p.day,n:i+1}))]);recipes.innerHTML=`<input class="search" placeholder="Search rice, prawns, omelette…" oninput="filterRecipes(this.value)"><div id="recipeList">${recipeHTML(list)}</div>`}function recipeHTML(list){return list.map(x=>`<div class="library-card recipeItem"><span class="pill">${x.day} · Meal ${x.n}</span><h3>${esc(x.title)}</h3><p>${esc(x.recipe)}</p><details><summary>Ingredients & portions</summary><p>${x.foods.map(a=>esc(a.replace('|',' — '))).join('<br>')}</p></details></div>`).join('')}function filterRecipes(q){document.querySelectorAll('.recipeItem').forEach(e=>e.hidden=!e.textContent.toLowerCase().includes(q.toLowerCase()))}
function openModal(html){modalBody.innerHTML=html;modal.classList.add('open')}function closeModal(){modal.classList.remove('open');editingId=null}modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});function toastMsg(s){toast.textContent=s;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
async function quickExact(date,n){let old=(await all()).find(x=>x.type==='meal'&&x.date===date&&x.meal===n);if(old&&!old.unlocked){openMeal(date,n);return}let d=new Date(date+'T12:00:00'),m=dayPlan(d)['m'+n];await put({id:old?.id||crypto.randomUUID(),type:'meal',date,meal:n,exact:true,actual:m.foods.map(x=>x.replace('|',' ')).join('\n'),analysis:'Completed exactly as planned.',created:old?.created||Date.now(),updated:Date.now(),unlocked:false});toastMsg('Meal saved');renderToday()}
function compare(plan,text){let actual=text.toLowerCase(),missing=[],qty=[];plan.foods.forEach(f=>{let [name,detail='']=f.split('|'),terms=name.toLowerCase().split(/\s+|\//).filter(w=>w.length>3),found=terms.some(w=>actual.includes(w));if(!found)missing.push(name);let q=detail.match(/\d+(?:\s*[–-]\s*\d+)?\s*(?:g|tbsp)/i);if(found&&q&&!actual.includes(q[0].toLowerCase().replace(/\s/g,''))&&!actual.replace(/\s/g,'').includes(q[0].toLowerCase().replace(/\s/g,'')))qty.push(`${name}: planned ${q[0]}, actual quantity not matched`)});let extras=text.split(/\n|,/).map(x=>x.trim()).filter(Boolean).filter(x=>!plan.foods.some(f=>{let n=f.split('|')[0].toLowerCase();return n.split(/\s+|\//).filter(w=>w.length>3).some(w=>x.toLowerCase().includes(w))}));let bits=[];if(missing.length)bits.push('Possible missing planned items: '+missing.join(', ')+'.');if(qty.length)bits.push('Quantity checks: '+qty.join('; ')+'.');if(extras.length)bits.push('Items recorded beyond recognized planned names: '+extras.join(', ')+'.');return bits.join(' ')||'Actual entry appears to include the recognized planned items. Review quantities manually.'}
async function openMeal(date,n){let d=new Date(date+'T12:00:00'),m=dayPlan(d)['m'+n],old=(await all()).find(x=>x.type==='meal'&&x.date===date&&x.meal===n),locked=old&&!old.unlocked;selectedMeal={date,n,m};openModal(`<h2>Record Meal ${n}</h2><p class="notice">${date} · ${esc(m.title)}</p>${locked?`<div class="analysis good">Saved records are locked by default. Unlock below only when you intentionally need to correct this record.</div><div class="entry"><b>${old.exact?'Completed exactly':'Different meal recorded'}</b><p>${esc(old.actual).replace(/\n/g,'<br>')}</p><p>${esc(old.analysis)}</p></div><button class="btn outline" style="width:100%" onclick="unlockMeal('${old.id}')">Advanced: unlock for editing</button>`:`<form class="form" onsubmit="saveMeal(event,'${old?.id||''}')"><div class="choice"><button type="button" class="btn ${old?.exact?'active':''}" onclick="setExact(true,this)">✓ Ate exactly</button><button type="button" class="btn ${old&&!old.exact?'active':''}" onclick="setExact(false,this)">Ate differently</button></div><input type="hidden" id="exact" value="${old?.exact?'1':'0'}"><label>What I actually ate</label><textarea id="actual" required placeholder="One item per line, include quantities…">${esc(old?.actual||'')}</textarea><div id="liveAnalysis" class="analysis">Simple comparison will appear after saving.</div><button class="btn primary" style="width:100%;margin-top:15px">Save & lock record</button></form>`}`)}
function setExact(v,b){exact.value=v?'1':'0';b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(v)actual.value=selectedMeal.m.foods.map(x=>x.replace('|',' ')).join('\n')}
async function saveMeal(e,id){e.preventDefault();let ex=exact.value==='1',a=actual.value.trim(),an=ex?'Completed exactly as planned.':compare(selectedMeal.m,a),old=id?(await all()).find(x=>x.id===id):null;await put({id:id||crypto.randomUUID(),type:'meal',date:selectedMeal.date,meal:selectedMeal.n,exact:ex,actual:a,analysis:an,created:old?.created||Date.now(),updated:Date.now(),unlocked:false});closeModal();toastMsg('Saved and locked');renderToday()}
async function unlockMeal(id){let r=(await all()).find(x=>x.id===id);r.unlocked=true;await put(r);closeModal();openMeal(r.date,r.meal)}
function healthForm(){openModal(`<h2>Add health record</h2><p class="notice">Keep measurements and reports together. Records lock after saving.</p><form class="form" onsubmit="saveHealth(event)"><label>Date</label><input id="hdate" type="date" value="${iso(new Date())}" required><div class="grid2"><div><label>Fasting CBS (mg/dL)</label><input id="fasting" type="number"></div><div><label>Post prandial CBS</label><input id="post" type="number"></div><div><label>BP systolic</label><input id="sys" type="number"></div><div><label>BP diastolic</label><input id="dia" type="number"></div><div><label>Weight (kg)</label><input id="weight" type="number" step=".1"></div><div><label>Resting heart rate</label><input id="hr" type="number"></div><div><label>Sleep (hours)</label><input id="sleep" type="number" step=".1"></div><div><label>Exercise (minutes)</label><input id="exercise" type="number"></div></div><label>Notes</label><textarea id="notes"></textarea><div class="filedrop"><label for="files">Attach report images or files</label><input id="files" type="file" accept="image/*,.pdf" multiple></div><button class="btn primary" style="width:100%;margin-top:15px">Save & lock record</button></form>`)}
async function saveHealth(e){e.preventDefault();let attachments=[];for(let f of files.files)attachments.push({name:f.name,type:f.type,data:await f.arrayBuffer()});await put({id:crypto.randomUUID(),type:'health',date:hdate.value,fasting:fasting.value,post:post.value,sys:sys.value,dia:dia.value,weight:weight.value,hr:hr.value,sleep:sleep.value,exercise:exercise.value,notes:notes.value,attachments,created:Date.now(),unlocked:false});closeModal();toastMsg('Health record locked');renderHealth()}
async function renderHealth(){let rs=(await all()).filter(x=>x.type==='health').sort((a,b)=>a.date.localeCompare(b.date));health.innerHTML=`<button class="btn primary" style="width:100%" onclick="healthForm()">＋ Add health record</button><div class="section-title"><h2>Trends</h2><span>${rs.length} records</span></div><canvas id="chart" width="500" height="190"></canvas><div>${rs.length?rs.slice().reverse().map(r=>`<div class="entry"><span class="pill">${r.date}</span><h3>${r.fasting?`Fasting CBS ${esc(r.fasting)} mg/dL`:'Health record'}</h3><p>${r.post?'Post prandial CBS '+esc(r.post)+' mg/dL · ':''}${r.sys?`BP ${esc(r.sys)}/${esc(r.dia)} · `:''}${r.weight?'Weight '+esc(r.weight)+' kg':''}</p><p>${r.sleep?'Sleep '+esc(r.sleep)+'h · ':''}${r.exercise?'Exercise '+esc(r.exercise)+' min · ':''}${r.attachments?.length||0} attachment(s)</p>${r.notes?`<p>${esc(r.notes)}</p>`:''}</div>`).join(''):'<div class="empty">No health records yet.</div>'}</div>`;drawChart(rs)}
function drawChart(rs){let c=document.querySelector('#chart'),x=c.getContext('2d'),vals=rs.map(r=>+r.fasting).filter(Boolean);x.clearRect(0,0,c.width,c.height);x.strokeStyle='#26332d';for(let i=1;i<5;i++){x.beginPath();x.moveTo(35,i*35);x.lineTo(480,i*35);x.stroke()}if(vals.length<2){x.fillStyle='#8f9e97';x.font='14px system-ui';x.fillText('Add at least two fasting CBS records to see a trend',55,100);return}let lo=Math.min(...vals)-10,hi=Math.max(...vals)+10;x.strokeStyle='#72e4a4';x.lineWidth=4;x.beginPath();vals.forEach((v,i)=>{let px=35+i*(440/(vals.length-1)),py=170-(v-lo)/(hi-lo)*140;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
async function exportData(){let rs=await all(),out=[];for(let r of rs){let c={...r};if(c.attachments)c.attachments=await Promise.all(c.attachments.map(async a=>({...a,data:arrayTo64(a.data)})));out.push(c)}let blob=new Blob([JSON.stringify({app:'TwoMealCompanion',version:1,exported:new Date().toISOString(),records:out},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='two-meal-backup-'+iso(new Date())+'.json';a.click();URL.revokeObjectURL(a.href)}function arrayTo64(b){let s='',u=new Uint8Array(b);for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)}function b64ToArray(s){let b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}
async function restore(input){let f=input.files[0];if(!f)return;try{let j=JSON.parse(await f.text());if(j.app!=='TwoMealCompanion'||!Array.isArray(j.records))throw 0;for(let r of j.records){if(r.attachments)r.attachments=r.attachments.map(a=>({...a,data:b64ToArray(a.data)}));await put(r)}toastMsg('Backup restored');renderMore()}catch(e){alert('This is not a valid Two-Meal Companion backup.')};input.value=''}
async function renderMore(){let rs=await all();more.innerHTML=`<div class="settings-card"><span class="pill">Local & private</span><h2>${rs.length} locked records</h2><p class="notice">Your entries and attachments are stored in this browser using IndexedDB. They do not leave your device. Browser data can still be cleared, so make regular backups.</p></div><div class="settings-card"><h3>Backup</h3><p class="notice">Export includes meal records, health history, notes and report attachments.</p><button class="btn primary" style="width:100%" onclick="exportData()">Export complete backup</button><label class="btn outline" style="display:block;text-align:center;margin-top:10px">Restore backup<input hidden type="file" accept="application/json" onchange="restore(this)"></label></div><div class="settings-card"><h3>Record policy</h3><p class="notice">Records are immutable by default: there is no normal delete button. Individual meal records can only be corrected through the advanced unlock action, preserving their original creation time.</p></div><div class="settings-card"><h3>Source & safety</h3><p class="notice">Meal wording and portioning are transcribed from doctor-issued menus in the supplied WhatsApp diet-plan chat. The app cycles a source-based seven-day set for convenient current use. Comparisons only identify missing, extra, or differently quantified entries. They are not medical analysis.</p></div>`}
renderNav();openDB().then(renderToday).catch(()=>document.querySelector('#today').innerHTML='<div class="analysis">Persistent storage could not be opened. Try Safari without Private Browsing.</div>');
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script></body></html>
